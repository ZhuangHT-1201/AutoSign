name: 问题反馈
description: 报告可复现的缺陷
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请不要粘贴 Cookie、认证票据、学号、姓名、真实课程表或包含个人信息的响应正文。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - Android
        - Web 演示
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 课迹版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开… 2. 点击…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请对错误提示和界面截图中的个人信息打码。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容中不包含 Cookie、票据、学号、密码或完整个人课表。
          required: true
